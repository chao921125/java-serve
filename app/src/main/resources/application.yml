# ============================================
# Java Serve Admin - 主配置文件
# ============================================
server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: java-serve

  # 默认环境
  profiles:
    active: @spring.active@

  # Jackson 配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.cc.core.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# JWT 配置
application:
  security:
    jwt:
      # 密钥（至少 256 位，Base64 编码）
      secret-key: NzA0ZjZiY2JlODgxN2VhMjAzZjU0OTU4ZWUyMGE1NmQ3MjcxZjhhYzJjYzM3YjFiMTI2YTIyOGExYjE1Mjk3Yg==
      # Token 过期时间（毫秒） —— 默认 24 小时
      expiration: 86400000
      refresh-token:
        # Refresh Token 过期时间 —— 默认 7 天
        expiration: 604800000

# 日志
logging:
  level:
    com.cc: debug
    org.springframework.security: warn
  file:
    path: ./logs
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator 监控
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}

# 文件存储配置（默认本地存储）
file-storage:
  type: local
  local-path: ./uploads
  max-file-size: 100
  presigned-expire: 3600

# SpringDoc API 文档
springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /api
    tags-sorter: alpha
    operations-sorter: alpha

# ============================================
# XXL-Job 任务调度默认配置
# ============================================
xxl:
  job:
    admin-addresses: http://localhost:9080/xxl-job-admin
    appname: java-serve-executor
    port: 9999
    access-token: default_token
    log-retention-days: 30

# ============================================
# RocketMQ 默认配置
# ============================================
rocketmq:
  name-server: localhost:9876
  producer:
    group: ${spring.application.name}-producer
    send-message-timeout: 3000
    retry-times-when-send-failed: 2
